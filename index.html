<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Programmer Gabut</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="introPage" class="page">
    <h1>Momen Ketika Programmer Gabut</h1>
    <button id="startBtn">Lanjut</button>
    <p class="credit">Code by Divzz</p>
  </div>

  <div id="mainPage" class="page" style="display:none">
    <audio id="audio" src="oasis.mp3"></audio>

    <div id="videoContainer">
      <video id="video" muted>
        <source id="videoSource" src="intro.mp4" type="video/mp4" />
      </video>
    </div>

    <div class="controls">
      <button id="playBtn">Play</button>
      <button id="pauseBtn">Pause</button>
      <button id="continueBtn">Lanjutkan</button>
    </div>

    <div id="blackout"></div>
    <p id="codeCredit">Code by Divzz</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
